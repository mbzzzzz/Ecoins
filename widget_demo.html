<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eco Rewards Widget Demo</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0fdf4;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            flex-direction: column;
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
        }

        h2 {
            margin-top: 0;
            color: #166534;
        }

        #debug-log {
            margin-top: 20px;
            padding: 10px;
            background: #eee;
            border: 1px solid #ccc;
            width: 100%;
            max-width: 800px;
            max-height: 300px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
            display: block;
        }
    </style>
    <script>
        (function () {
            // Initialize debug logger early
            window.addEventListener('DOMContentLoaded', () => {
                const logger = document.getElementById('debug-log');
                const originalLog = console.log;
                const originalError = console.error;

                // Create logger if it doesn't exist yet (since body isn't parsed)
                // Actually, we can't append to #debug-log yet if we run in HEAD.
                // Queue messages? Or just overwrite console and append later.
            });

            const logQueue = [];
            const originalLog = console.log;
            const originalError = console.error;

            function flushQueue() {
                const logger = document.getElementById('debug-log');
                if (!logger) return;
                while (logQueue.length > 0) {
                    const { msg, isError } = logQueue.shift();
                    const line = document.createElement('div');
                    line.style.color = isError ? 'red' : 'black';
                    line.textContent = '>' + msg;
                    logger.appendChild(line);
                }
            }

            function pushLog(msg, isError) {
                if (document.getElementById('debug-log')) {
                    const logger = document.getElementById('debug-log');
                    const line = document.createElement('div');
                    line.style.color = isError ? 'red' : 'black';
                    line.textContent = '>' + msg;
                    logger.appendChild(line);
                } else {
                    logQueue.push({ msg, isError });
                }
            }

            console.log = function (...args) {
                originalLog.apply(console, args);
                pushLog(args.join(' '), false);
            };

            console.error = function (...args) {
                originalError.apply(console, args);
                pushLog(args.join(' '), true);
            };

            window.addEventListener('DOMContentLoaded', flushQueue);
            window.addEventListener('load', flushQueue);
        })();
    </script>
</head>

    <div id="debug-log">
        <strong>Debug Protocol Started...</strong><br>
    </div>

    <script>
        (function () {
            const logger = document.getElementById('debug-log');
            const originalLog = console.log;
            const originalError = console.error;

            function logToScreen(msg, isError) {
                const line = document.createElement('div');
                line.style.color = isError ? 'red' : 'black';
                line.textContent = '>' + msg;
                logger.appendChild(line);
            }

            console.log = function (...args) {
                originalLog.apply(console, args);
                logToScreen(args.join(' '), false);
            };

            console.error = function (...args) {
                originalError.apply(console, args);
                logToScreen(args.join(' '), true);
            };

            window.onerror = function (msg, url, lineNo, columnNo, error) {
                logToScreen('Global Error: ' + msg + ' at ' + url + ':' + lineNo, true);
                return false;
            };

            // Test fetch to API to verify connectivity
            console.log("Testing connection to brand-api...");
            fetch('https://gwmcmlpuqummaumjloci.supabase.co/functions/v1/brand-api?key=e4dc073d-5cc7-4825-a20e-c755cfea6d56')
                .then(res => {
                    console.log("Health check status: " + res.status);
                    return res.text();
                })
                .then(txt => console.log("Response start: " + txt.substring(0, 50) + "..."))
                .catch(err => console.error("Health check failed: " + err));

        })();
    </script>
